<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a5c"/>
      <stop offset="60%" stop-color="#142a44"/>
      <stop offset="100%" stop-color="#0d1e30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c66b"/>
      <stop offset="100%" stop-color="#e8a53a"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- 顶部系列标识 -->
  <text x="60" y="52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#9db8d4" letter-spacing="2">深圳中考 · 基本态势系列 · 第1篇</text>

  <!-- 金色装饰线 -->
  <rect x="60" y="74" width="100" height="4" rx="2" fill="url(#gold)"/>

  <!-- 主标题 -->
  <text x="60" y="158" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#ffffff">2027届家长</text>
  <text x="60" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#ffffff">现在该做什么？</text>

  <!-- 金色强调行 -->
  <text x="60" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="url(#gold)">现在开始，刚刚好</text>

  <!-- 副标 -->
  <text x="60" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#c9d9e8" letter-spacing="1">2026年中考已结束 · 9个月信息优势窗口已开启</text>

  <!-- 右下角装饰圆 -->
  <circle cx="830" cy="80" r="70" fill="none" stroke="#2a4d70" stroke-width="1.5" opacity="0.5"/>
  <circle cx="830" cy="80" r="46" fill="none" stroke="#2a4d70" stroke-width="1" opacity="0.4"/>
</svg>
